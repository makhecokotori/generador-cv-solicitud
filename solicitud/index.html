<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitud de empleo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232563eb'/%3E%3Ctext x='32' y='41' font-size='26' font-weight='800' text-anchor='middle' fill='white' font-family='Arial'%3ECV%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/cv.css">
  <link rel="stylesheet" href="../assets/css/solicitud.css">
  <link rel="stylesheet" href="../assets/css/print.css" media="print">
</head>
<body class="builder solicitud">
  <header class="topbar">
    <a class="topbar-back" href="../index.html">← Inicio</a>
    <div class="brand"><div class="brand-mark">CV</div></div>
    <h1 class="topbar-title">Solicitud de empleo</h1>
    <div class="topbar-actions">
      <button type="button" id="btn-clear" class="btn btn-ghost">Limpiar</button>
      <button type="button" id="btn-preview" class="btn">Ver vista previa</button>
      <button type="button" id="btn-print" class="btn btn-primary">Guardar en PDF</button>
    </div>
  </header>

  <div class="workspace">
    <!-- Formulario: se escribe directamente sobre el formato original -->
    <aside class="panel panel-left" id="panel-left">
      <div class="panel-section">
        <h2 class="panel-title">Formato de solicitud</h2>
        <p class="panel-hint">Escribe directamente sobre el formato de 2 páginas. No hay módulos: se respeta el diseño original.</p>
      </div>
      <div id="form-root" class="form-root sol-form-root"></div>
    </aside>

    <!-- Vista previa con selector de tema -->
    <main class="panel panel-right">
      <div class="preview-toolbar">
        <span class="preview-label">Vista previa</span>
        <div class="sol-theme-switch">
          <button type="button" class="chip" data-theme="white">Blanco / negro</button>
          <button type="button" class="chip" data-theme="beige">Beige / marrón</button>
        </div>
      </div>
      <div class="preview-scroll">
        <div id="preview-empty" class="preview-empty">
          Completa el formulario y pulsa <b>Ver vista previa</b> para revisar el documento antes de crear el PDF.
        </div>
        <div id="preview-root" class="sol-preview theme-white" hidden></div>
      </div>
    </main>
  </div>

  <script src="../assets/js/solicitud.js"></script>
</body>
</html>
